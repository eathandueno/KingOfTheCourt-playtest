<!-- Weapon audio attribution
# Weapon recording credits

## Active recorded v5 bank

`recorded_v5/` replaces the v4 firing reports with individual shots from the
CC0 Free Firearm Sound Library credited below. Processing: select microphone
channel zero, trim onset, filter 32-17500 Hz, resample to mono 48 kHz, remove
DC, fade boundaries and normalize to -2 dBFS. No synthesized bass, added bolt
clicks, pitch layers, saturation or intentional clipping in these reports.
Fictional heavy-pistol, launcher and minigun roles adapt the listed recordings;
they are not recordings of those exact weapon models. Melee and motor/handling
cues are copied unchanged from v4 and still contain authored synthesis.
Originals and the v4 bank are preserved. Build with
`tools/loop-court/build_recording_only_audio.py`; v5 manifest records source hashes.
No new Freesound recordings were downloaded or incorporated.

## Intense v4 derivatives

`intense_v4/` reuses the credited local close-report banks below. Changes: pitch-shifted recorded body layers, shaped pressure/noise synthesis, mechanical transients, parallel saturation and intentional waveform clipping, followed by -2 dBFS sample-peak normalization. Non-firearm and motor layers are authored local NumPy synthesis. These are designed game effects, not claims of exact weapon-model recordings. Originals are preserved. `intense_v4/manifest.json` records exact source and output SHA-256 hashes; rebuild with `tools/loop-court/build_intense_weapon_audio.py`.

Gunshot Sounds by Vincent Sevedge (Tabasco), copyright 2009:
https://opengameart.org/content/gunshot-sounds

CZ52 pistol, SKS, Mosin-Nagant and shotgun recordings from sounds.zip.
The archive's creativecommons.txt specifies Creative Commons Attribution 3.0
Unported: https://creativecommons.org/licenses/by/3.0/
The website lists CC0, but we retain the archive's attribution and license terms.
Original notice is preserved in recordings/creativecommons.txt.
Changes: mono conversion, onset trimming, EQ, pitch adjustment, shortened decay,
quiet reflections, saturation and layering with the game's existing sounds.
SMG and machine-gun assets adapt pistol/rifle reports, not recordings of those
exact automatic weapons.

Gunshots by kurt, CC0:
https://opengameart.org/content/gunshots
Original 22 Pistol.wav and Black Powder.wav are retained as recorded_pistol.wav
and recorded_black_powder.wav. They supply underlying body layers, including
our previously generated sniper_heavy.wav derivative.

No Bodycam game audio is included.

Sniper prototype: The Free Firearm Sound Library, CC0, by Ben Jaszczak,
Brian Nelson, Kevin Heras and Matthew Nanney.
https://opengameart.org/content/the-free-firearm-sound-library
https://creativecommons.org/publicdomain/zero/1.0/
Source: Prepared SFX Library/Mosin Nagant/M_21P.wav (96 kHz, 24-bit,
separate microphone channels). Three actual shots selected from this recording.
Changes: select one microphone, trim, filter, downsample to 48 kHz, shape decay
and layer the existing sniper body plus synthesized low pressure.

Current full recorded blast bank (supersedes the sniper prototype):
The Free Firearm Sound Library, CC0, same authors and source URL above.
Selected source files: A_42P.wav and A_34P.wav (1911), G_20P.wav (Carl Gustav
M45), D_24P.wav and D_32P.wav (AR-15), C_28P.wav (AK-47), M_21P.wav and
M_26P.wav (Mosin-Nagant), N_26P.wav (Mossberg).
Changes: choose microphone channel zero, trim, filter, downsample, reinforce
recorded body frequencies, reduce late decay, add a subtle existing recorded
body layer and normalize. No oscillator or artificial reflection taps.
The AK-47 and Mossberg are adapted for the fictional machine-gun/cannon roles.

Reload handling cues (CC0):
Gun reload sounds by SpringySpringo:
https://opengameart.org/content/gun-reload-sounds
Source gunreload1.wav, assaultriflereload1_0.wav and shotguncock_0.wav.
The creator identifies these as airsoft-gun handling recordings.
Equipment clicks III by LFA:
https://opengameart.org/content/equipment-clicks-iii
Source equipment_clicks3.wav; a collection of rifle-bolt and household mechanical
recordings. Individual edits are designed foley, not claims that every cut is
an exact recording of the depicted weapon's mechanism.
Changes: isolate cues, remove DC/low noise, resample, adjust pitch and normalize.
Exact source cuts are preserved in reload_manifest.json. No gunshot mix changed.

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":148413172,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

const courtPreload = engine.preloadFile.bind(engine);
engine.preloadFile = async (file, path) => {
    if (file !== "index.pck") return courtPreload(file, path);
    const chunks = [];
    for (const url of ["index.pck.gz.part0?release=64bf4ccfcc888c40", "index.pck.gz.part1?release=64bf4ccfcc888c40"]) {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Game download failed: " + response.status);
        chunks.push(await response.blob());
    }
    const bytes = await new Response(new Blob(chunks).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    if (bytes.byteLength !== GODOT_CONFIG.fileSizes["index.pck"]) throw new Error("Incomplete game download. Refresh to retry.");
    return courtPreload(bytes, path || "index.pck");
};


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
statusOverlay.dataset.loadingStage = current > 0 && total > 0 && current >= total ? 'Preparing graphics. First visits can take longer…' : 'Downloading game files…';
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
